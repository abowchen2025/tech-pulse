name: 每日文章自動產生

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install anthropic opencc-python-reimplemented

      - name: 產生今日文章
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ABOW_CHEN_2025_TECH_PULSE_ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: 提交並推送
        run: |
          git config user.name "tech-pulse-bot"
          git config user.email "bot@tech-pulse.local"
          git add content/posts/ scripts/github_trend_history.json scripts/topic_history.json
          git commit -m "每日文章：$(date -u +%Y-%m-%d)" || echo "沒有變更"
          git push

      - name: 觸發網站部署
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hugo.yml