name: 每日文章自動產生

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: '沿用某次失敗 run 的原始輸出（填該 run 的編號，不會呼叫 API、不花費用）。留空則正常產生今日文章'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install anthropic opencc-python-reimplemented

      - name: 下載先前 run 的原始輸出
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download ${{ inputs.reuse_run_id }} -n raw-output -D raw_output

      - name: 產生今日文章
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ABOW_CHEN_2025_TECH_PULSE_ANTHROPIC_API_KEY }}
          REUSE_RAW: ${{ inputs.reuse_run_id != '' && '1' || '0' }}
        run: python scripts/generate_post.py

      - name: 保存原始輸出（後續步驟失敗時可沿用，不必再付 API 費用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-output
          path: raw_output/
          retention-days: 7
          if-no-files-found: ignore

      - name: 提交並推送
        run: |
          git config user.name "tech-pulse-bot"
          git config user.email "bot@tech-pulse.local"
          git add content/posts/ scripts/github_trend_history.json scripts/topic_history.json
          git commit -m "每日文章：$(date -u +%Y-%m-%d)" || echo "沒有變更"
          git push

      - name: 觸發網站部署
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hugo.yml