name: 每日文章自動產生

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00，等於台灣時間 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install anthropic

      - name: 產生今日文章
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_post.py

      - name: 提交並推送
        run: |
          git config user.name "tech-pulse-bot"
          git config user.email "bot@tech-pulse.local"
          git add content/posts/
          git commit -m "每日文章：$(date -u +%Y-%m-%d)" || echo "沒有變更"
          git push